name: CI

# A new push makes the running build of the same branch obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and run unit tests
        run: ./gradlew assembleDebug :core_model:test :core_data:testDebugUnitTest :feature_entry:testDebugUnitTest --stacktrace

      # The release key of the app. It is in the secrets of the repository,
      # never in the repository itself: Android only installs an update over
      # an installed app when the signature is the same.
      - name: Restore the release key
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE" | base64 --decode > keystore/release.jks

      # Every build produces the signed APK, so there is always something
      # that can be installed - and it installs over the previous one.
      - name: Build the signed APK
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: keystore/release.jks
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # Guards the invariants that are easy to break silently: the app must
      # not be able to reach the network, its native libraries must work on
      # 16 KB page size devices, and the build that ships must not be signed
      # with the public debug key.
      - name: Verify privacy invariants
        run: python3 scripts/verify_privacy_invariants.py

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            **/build/test-results/testDebugUnitTest/*.xml
            **/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  # The instrumented tests need the AndroidKeyStore, SQLCipher and a real
  # screen, so they run on an emulator (without any hardware). They are the
  # ones that catch the regressions a unit test cannot see: the accessibility
  # checks, the key rotation and the backup round trip.
  instrumented:
    # The release APK of the build job is checked here, so the job waits for
    # it.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # The emulator needs the virtualisation of the runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator needs seven gigabytes for the user data partition and the
      # runner does not have that much free. The NDK, the older platforms and
      # the toolchains that are not part of this project go.
      - name: Free disk space for the emulator
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sudo rm -rf "$SDK/ndk" "$SDK/ndk-bundle" "$SDK/cmake"
          sudo rm -rf "$SDK"/platforms/android-3[0-5]
          sudo rm -rf /opt/ghc /usr/local/share/boost
          df -h /

      # The release build of the build job: it is the one that is published,
      # so it has to start.
      - name: Download the release APK
        uses: actions/download-artifact@v8
        with:
          name: app-release
          path: app/build/outputs/apk/release

      - name: Run the instrumented tests and check the release build
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          # The full system image, not the one for automated tests: the
          # Keystore of the stripped image cannot create a key that needs the
          # hardware of the device, and the key of the app is exactly such a
          # key.
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -camera-back none
          # The image of the runner asks for more disk than the runner has.
          pre-emulator-launch-script: .github/emulator-setup.sh
          script: .github/run-instrumented-tests.sh

      - name: Upload the instrumented test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-results
          path: |
            **/build/outputs/androidTest-results/**
            **/build/reports/androidTests/**
          if-no-files-found: ignore
