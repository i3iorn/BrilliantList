name: Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# A tag builds the signed APK and publishes it as a release. The download URL
# is then always the same:
#   https://github.com/i3iorn/BrilliantList/releases/latest/download/app-release.apk
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag of the release, for example v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # The version of the app is written down in one place, and the tag of a
      # release has to match it. Otherwise the build would carry a version
      # that does not belong to the release.
      - name: Check the version against the tag
        run: |
          VERSION="$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "The tag is $TAG but the app says $VERSION."
            echo "Put the version into version.properties before you tag a release."
            exit 1
          fi
          echo "The release carries the version $VERSION."

      # The key of the app. It is in the secrets of the repository, never in
      # the repository itself: Android only installs an update over an
      # installed app when the signature is the same.
      - name: Restore the release key
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE" | base64 --decode > keystore/release.jks

      # The credentials go into the environment, not onto the command line, so
      # they cannot end up in the log of the runner.
      - name: Build the signed APK
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: keystore/release.jks
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # The APK that ships must not be signed with the public debug key, and
      # the app must not be able to reach the network.
      - name: Verify the privacy invariants
        run: python3 scripts/verify_privacy_invariants.py

      - name: Check the signature
        run: |
          for signer in $ANDROID_HOME/build-tools/*/apksigner; do
            "$signer" verify --print-certs app/build/outputs/apk/release/app-release.apk
            break
          done

      - name: Write the checksum
        run: |
          cd app/build/outputs/apk/release
          sha256sum app-release.apk > app-release.apk.sha256

      # The mapping of the shrinking is big, so it goes into the release
      # compressed. It is what makes a stack trace of a release build
      # readable again.
      - name: Compress the mapping
        run: gzip -9 -k app/build/outputs/mapping/release/mapping.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          gh release create "$TAG" \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release.apk.sha256 \
            app/build/outputs/mapping/release/mapping.txt.gz \
            --title "BrilliantList $TAG" \
            --notes-file .github/release-notes.md \
            --latest
