name: CI

# A new push makes the running build of the same branch obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run unit tests
        run: ./gradlew assembleDebug :core_model:test :core_data:testDebugUnitTest :feature_entry:testDebugUnitTest --stacktrace

      # The release key of the app. It is in the secrets of the repository,
      # never in the repository itself: Android only installs an update over
      # an installed app when the signature is the same.
      - name: Restore the release key
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE" | base64 --decode > keystore/release.jks

      # Every build produces the signed APK, so there is always something
      # that can be installed - and it installs over the previous one.
      - name: Build the signed APK
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: keystore/release.jks
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # Guards the invariants that are easy to break silently: the app must
      # not be able to reach the network, its native libraries must work on
      # 16 KB page size devices, and the build that ships must not be signed
      # with the public debug key.
      - name: Verify privacy invariants
        run: python3 scripts/verify_privacy_invariants.py

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            **/build/test-results/testDebugUnitTest/*.xml
            **/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  # The instrumented tests need the AndroidKeyStore, SQLCipher and a real
  # screen, so they run on a managed device (an emulator without any hardware).
  # They are the ones that catch the regressions a unit test cannot see: the
  # accessibility checks, the key rotation and the backup round trip.
  instrumented:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The managed device is an emulator, it needs the virtualisation of the
      # runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the instrumented tests
        run: >-
          ./gradlew
          :app:pixel2api33DebugAndroidTest
          :core_data:pixel2api33DebugAndroidTest
          :core_encryption:pixel2api33DebugAndroidTest
          :feature_entry:pixel2api33DebugAndroidTest
          --max-workers=2 --stacktrace

      - name: Upload the instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: |
            **/build/outputs/androidTest-results/**
            **/build/reports/androidTests/**
          if-no-files-found: ignore
