# The version of the app.
#
# This is the one place the version is written down: the build reads it and
# the release workflow checks that the tag of a release matches it, so a
# release can never carry a version that does not belong to it.
#
# A pre-release (release candidate) carries a suffix, for example 0.3.4-rc1.
# Its tag is v0.3.4-rc1 and the release is published as a GitHub pre-release,
# so it never takes over the stable download URL.
#
# versionCode grows with every release, it is what Android compares. The
# scheme is major * 10000 + minor * 100 + patch, so 0.2.0 is 200 and the
# numbers keep growing in the right order. A release candidate uses the same
# versionCode as the final version it belongs to: the final build installs
# over the candidate without a version conflict, and an installed candidate
# is never "newer" than the final.
versionName=0.3.5
versionCode=304
